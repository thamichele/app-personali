name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # ogni ora, per portare nel repository F-Droid le nuove versioni delle app esterne (es. AntiDroidVirus,
  # che pubblica a ogni merge nel suo repository): arrivano qui entro un'ora
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  build:
    # il giro orario serve solo a ripubblicare l'indice F-Droid: niente build di prova
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # una voce per ogni app Android in apps/ (quelle per PC sono nel job "desktop")
        app: [ sveglia ]
    steps:
      - uses: actions/checkout@v5

      # stessa toolchain senza Gradle usata in locale (vedi build.sh)
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aapt dalvik-exchange zipalign apksigner

      - name: Download Android API jars
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://repo1.maven.org/maven2/org/robolectric/android-all/15-robolectric-13954326/android-all-15-robolectric-13954326.jar
          curl -sSfLO https://repo1.maven.org/maven2/org/robolectric/android-all/13-robolectric-9030017/android-all-13-robolectric-9030017.jar
          unzip -q android-all-13-robolectric-9030017.jar resources.arsc AndroidManifest.xml
          zip -q android-res-33.zip resources.arsc AndroidManifest.xml

      # firmato con una chiave usa e getta: serve solo a verificare che il codice compili
      - name: Build test APK
        run: |
          export ANDROID_CLASSES="$RUNNER_TEMP/android-all-15-robolectric-13954326.jar"
          export ANDROID_RES="$RUNNER_TEMP/android-res-33.zip"
          export KEYSTORE="$RUNNER_TEMP/test.jks" KS_PASS="$(openssl rand -hex 16)"
          ./build.sh ${{ matrix.app }}
          aapt dump badging build/${{ matrix.app }}/*.apk | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-test-apk
          path: build/${{ matrix.app }}/${{ matrix.app }}-*.apk
          if-no-files-found: error

  # App da terminale (TYPE=cli in app.conf): Python puro, nessuna dipendenza pip
  cli:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [ b1g-pentester ]
    steps:
      - uses: actions/checkout@v5

      - name: Controlla la sintassi e impacchetta
        run: ./build.sh ${{ matrix.app }}

      - name: Avvio di prova (senza TTY esce subito)
        run: |
          command -v ssh >/dev/null || sudo apt-get install -y -q openssh-client
          printf 'q\n' | PYTHONPATH=apps/${{ matrix.app }}/src python3 -m b1gpentester

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: build/${{ matrix.app }}/${{ matrix.app }}-*.tar.gz
          if-no-files-found: error

  # App per PC (TYPE=desktop in app.conf): pacchetto con Java incluso, costruito su ciascun sistema
  desktop:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        app: [ calendario ]
        os: [ ubuntu-24.04, windows-2022 ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q fakeroot

      - name: Build package
        run: PACKAGE=1 ./build.sh ${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}
          path: |
            build/${{ matrix.app }}/${{ matrix.app }}-*.zip
            build/${{ matrix.app }}/${{ matrix.app }}-*.tar.gz
            build/${{ matrix.app }}/${{ matrix.app }}-*.deb
          if-no-files-found: error

  # Pacchetto Arch (pacman -U) delle app per PC che hanno arch/PKGBUILD, costruito con makepkg su Arch
  arch:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        app: [ calendario ]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git jdk-openjdk libnotify hicolor-icon-theme ttf-dejavu

      - uses: actions/checkout@v5

      # ttf-dejavu: Java2D vuole almeno un carattere di sistema anche per disegnare le icone
      # makepkg non gira come root
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/apps/${{ matrix.app }}/arch' && makepkg --noconfirm"
          ls -la apps/${{ matrix.app }}/arch/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-Arch
          path: apps/${{ matrix.app }}/arch/*.pkg.tar.zst
          if-no-files-found: error

  # Release GitHub delle app per PC quando la versione in app.conf non ha ancora "<app>-vX.Y.Z"
  desktop-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [ desktop, arch ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Release new versions
        run: |
          for conf in apps/*/app.conf; do
            grep -q '^TYPE=desktop' "$conf" || continue
            APP=$(basename "$(dirname "$conf")")
            VERSION=$(sed -n 's/^VERSION_NAME=//p' "$conf")
            if gh release view "$APP-v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$APP $VERSION già pubblicata"
              continue
            fi
            gh release create "$APP-v$VERSION" dist/$APP-*/$APP-$VERSION-* --repo "$GITHUB_REPOSITORY" --title "$APP $VERSION" \
              --notes "Per PC. Windows: estrai lo zip e avvia Calendario.exe (Java incluso). Arch: sudo pacman -U $APP-$VERSION-1-any.pkg.tar.zst. Debian/Ubuntu/Mint: installa il .deb. Altri Linux: estrai il .tar.gz e avvia Calendario/bin/Calendario."
          done

  # Pubblica le app nuove: release GitHub firmata + repository F-Droid unico (ramo "fdroid", servito da
  # https://raw.githubusercontent.com/thamichele/app-personali/fdroid/repo). Un'app viene pubblicata quando la
  # versione in apps/<app>/app.conf non ha ancora una release "<app>-vX.Y.Z".
  # Richiede i secret RELEASE_KEYSTORE_BASE64 (keystore PKCS12 con le chiavi "app" e "repo") e
  # RELEASE_KEYSTORE_PASSWORD; senza di essi il job non fa nulla.
  publish:
    # parte anche quando la build di prova è saltata (giro orario), non quando è fallita
    if: github.event_name != 'pull_request' && !failure() && !cancelled()
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        id: secrets
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Secret di firma assenti: niente da pubblicare"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aapt dalvik-exchange zipalign apksigner
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet fdroidserver
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Download Android API jars
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://repo1.maven.org/maven2/org/robolectric/android-all/15-robolectric-13954326/android-all-15-robolectric-13954326.jar
          curl -sSfLO https://repo1.maven.org/maven2/org/robolectric/android-all/13-robolectric-9030017/android-all-13-robolectric-9030017.jar
          unzip -q android-all-13-robolectric-9030017.jar resources.arsc AndroidManifest.xml
          zip -q android-res-33.zip resources.arsc AndroidManifest.xml

      - name: Build and release new versions
        if: steps.secrets.outputs.ready == 'true'
        run: |
          export ANDROID_CLASSES="$RUNNER_TEMP/android-all-15-robolectric-13954326.jar"
          export ANDROID_RES="$RUNNER_TEMP/android-res-33.zip"
          export KEYSTORE="$RUNNER_TEMP/release.p12" KS_PASS="$RELEASE_KEYSTORE_PASSWORD" KS_ALIAS=app
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          : > "$RUNNER_TEMP/apks"
          for conf in apps/*/app.conf; do
            grep -qE '^TYPE=(desktop|cli)' "$conf" && continue # app per PC: job desktop-release; CLI: non si pubblica
            APP=$(basename "$(dirname "$conf")")
            VERSION=$(sed -n 's/^VERSION_NAME=//p' "$conf")
            if gh release view "$APP-v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$APP $VERSION già pubblicata"
              continue
            fi
            ./build.sh "$APP"
            gh release create "$APP-v$VERSION" "build/$APP/$APP-$VERSION.apk" --title "$APP $VERSION" \
              --notes "APK firmato. Aggiornamenti anche dal repository F-Droid https://raw.githubusercontent.com/thamichele/app-personali/fdroid/repo"
            echo "build/$APP/$APP-$VERSION.apk" >> "$RUNNER_TEMP/apks"
          done

      # aggiorna l'indice anche senza app nuove, così le app esterne restano aggiornate
      - name: Update F-Droid repository
        if: steps.secrets.outputs.ready == 'true'
        run: |
          FDROID_KEYSTORE="$RUNNER_TEMP/release.p12" FDROID_PASS="$RELEASE_KEYSTORE_PASSWORD" \
            ./fdroid.sh $(cat "$RUNNER_TEMP/apks")
          cd build/fdroid
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A repo metadata $( [ -d archive ] && echo archive )
          git diff --cached --quiet && { echo "Nessuna modifica"; exit 0; }
          git commit -q -m "F-Droid: aggiornamento ${GITHUB_RUN_NUMBER}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fdroid
          echo "== impronta del repository F-Droid"
          keytool -list -v -storetype pkcs12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias repo | grep "SHA256:"
